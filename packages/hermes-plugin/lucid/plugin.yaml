name: lucid
version: "0.2.0"
description: "Lucid observability: sends every turn, model call, tool call, sub-agent and approval to your Lucid dashboard, so you can see why the agent did what it did."
author: Lucid
kind: standalone
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
