# Self-host Lucid with Postgres. From this folder:
#   echo "POSTGRES_PASSWORD=<a long random password>" > .env
#   docker compose up -d
# Then open http://<your server>:4318 and create the first account.
# Put it behind HTTPS (Caddy, Traefik, nginx) before exposing it to the internet.
# (Kept out of the repo root so the root holds a single Dockerfile deploy.)
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucid
      # Postgres refuses to start without a password, so a missing .env fails loudly.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: lucid
    volumes:
      - lucid-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucid"]
      interval: 5s
      retries: 10

  lucid:
    build: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lucid:${POSTGRES_PASSWORD:-}@postgres:5432/lucid
      # Optional: by default the address comes from your reverse proxy's forwarded headers
      LUCID_PUBLIC_URL: ${LUCID_PUBLIC_URL:-}
      # closed = only accounts that already exist can sign in
      LUCID_SIGNUPS: ${LUCID_SIGNUPS:-open}
      # Optional: sign-in through Clerk instead of built-in email + password
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # Optional: a model key for Arena replays and the judge
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "4318:4318"

volumes:
  lucid-db:
