<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <!-- Light unless this browser picked dark (see src/theme.ts). -->
    <script>
      try {
        if (localStorage.getItem("lucid.theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#09090b");
        }
      } catch {}
    </script>
    <title>Lucid · Make your AI agents smarter every run</title>
    <meta name="description" content="Open-source observability for AI agents. See every prompt, tool call and decision, get failures grouped with a fix, and prove a better model or prompt on your own runs, blind." />
    <!-- The server writes its public address in front of /og.png when it serves this page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lucid" />
    <meta property="og:title" content="Lucid · Make your AI agents smarter every run" />
    <meta property="og:description" content="Open-source observability for AI agents: every run as a story, failures grouped with a fix, and blind model testing on your own runs." />
    <meta property="og:image" content="__LUCID_ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__LUCID_ORIGIN__/og.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d8f84a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2309090b'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
