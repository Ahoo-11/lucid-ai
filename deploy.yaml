app: lucid
type: dockerfile
target: vps
port: 4318
health:
  path: /healthz
env:
  # Postgres for all data. Release overlap rules out the embedded database
  # (the old and new release would share files), so this is required.
  - DATABASE_URL
  # The public address, e.g. https://lucid.example.com. Shown in setup snippets
  # and proxy URLs.
  - LUCID_PUBLIC_URL
risks:
  - migrations
release:
  prepare:
    - id: migrate
      image: node:22-bookworm-slim
      command: npm ci && npm run db:migrate -w @lucid/server
      env:
        - DATABASE_URL
      covers:
        - migrations
  verify:
    - id: schema
      image: node:22-bookworm-slim
      # Re-running migrations is a no-op on an up-to-date database; it fails if
      # the database is unreachable or the schema is ahead of this commit.
      command: npm ci && npm run db:migrate -w @lucid/server
      env:
        - DATABASE_URL
      covers:
        - migrations
resources:
  memory: 1g
  cpus: 1.0
