app: lucid
type: dockerfile
target: vps
port: 4318
health:
  # Also checks the database, so a release that cannot reach it is not promoted.
  path: /healthz
env:
  # Postgres for all data. Release overlap rules out the embedded database
  # (the old and new release would share files), so this is required.
  # Optional, not required: LUCID_PUBLIC_URL (defaults to the address the
  # proxy forwards), LUCID_SIGNUPS=closed, OPENROUTER_API_KEY (Arena replays).
  - DATABASE_URL
  # Sign-in through Clerk (dashboard.clerk.com → API keys).
  - CLERK_PUBLISHABLE_KEY
  - CLERK_SECRET_KEY
  # Meta's Muse Spark on Baseten: writes the Inbox diagnoses and runs the
  # Arena's replays and judge.
  - BASETEN_API_KEY
risks:
  - migrations
release:
  prepare:
    - id: migrate
      image: node:22-bookworm-slim
      command: npm ci && npm run db:migrate -w @lucid/server
      env:
        - DATABASE_URL
      covers:
        - migrations
  verify:
    - id: schema
      image: node:22-bookworm-slim
      # Read-only: fails unless every migration in this commit is applied.
      command: npm ci && npm run db:verify -w @lucid/server
      env:
        - DATABASE_URL
      covers:
        - migrations
resources:
  memory: 1g
  cpus: 1.0
